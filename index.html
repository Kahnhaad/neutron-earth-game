<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neutron Earth: The Lost Valley</title>
  <style>
    body {
      background: #0b1020;
      color: #f4f4f4;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .game {
      max-width: 700px;
      background: #151a30;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: #7cf0ff;
    }
    #scene-text {
      margin: 16px 0 20px;
      line-height: 1.5;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button.choice {
      background: #243356;
      color: #f4f4f4;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button.choice:hover {
      background: #32446f;
      transform: translateY(-1px);
    }
    button.choice:active {
      transform: translateY(1px);
    }
    .tagline {
      font-size: 0.9rem;
      color: #9bb3ff;
      margin-bottom: 8px;
    }
    .footer {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #7a8bbf;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Neutron Earth: The Lost Valley</h1>
    <div class="tagline">A short story adventure about uranium, neptunium, and the environment.</div>
    <div id="scene-text"></div>
    <div class="choices" id="choices"></div>
    <div class="footer">Made by Ahad ✦ Environmental Story Game</div>
  </div>

  <script>
    const scenes = {
      start: {
        text: `
Kai, a young environmental scout, sits in a small monitoring station in Australia.

An alert flashes on the screen:

<b>RADIATION SPIKE DETECTED — REDWATER VALLEY</b>

The Environmental Response Network sends a message:

“Levels near the old mining valley are rising fast. We need eyes on the ground.”

What does Kai do?
        `,
        choices: [
          { text: "Investigate the valley in person.", next: "arrival" },
          { text: "Check old mining records first.", next: "records" },
          { text: "Ignore the warning and stay inside.", next: "bad_ignore" }
        ]
      },

      records: {
        text: `
Kai opens the dusty digital archive.

Redwater Valley: once home to a <b>uranium mine</b> and a small <b>experimental neptunium reactor</b>.
The files mention “temporary waste storage” and “reactor shutdown planned” — but there’s no final report.

Something was started… and never properly finished.

Kai realises this could be serious.
        `,
        choices: [
          { text: "Head to Redwater Valley immediately.", next: "arrival" }
        ]
      },

      arrival: {
        text: `
Kai arrives at Redwater Valley.

The trees look normal, the sky is clear — but the Geiger counter clicks faster with every step.

Ahead, three points of interest stand out:

• An <b>abandoned uranium mine</b>, sealed with rusted gates.  
• A cluster of <b>neptunium waste barrels</b>, half-buried in the dirt.  
• A <b>river</b> that seems to glow faintly under the light.

Where does Kai go first?
        `,
        choices: [
          { text: "Explore the abandoned uranium mine.", next: "mine" },
          { text: "Inspect the neptunium waste barrels.", next: "barrels" },
          { text: "Investigate the glowing river.", next: "river" }
        ]
      },

      mine: {
        text: `
Kai approaches the old uranium mine.

Warning signs hang crooked: “RADIATION HAZARD — AUTHORIZED PERSONNEL ONLY”.

Inside, the air feels heavy. The Geiger counter spikes near a collapsed tunnel.
A faint hum can be heard deeper underground, like machinery still running.

This mine wasn’t just for digging. Something else is below.

        `,
        choices: [
          { text: "Follow the hum deeper underground.", next: "reactor" },
          { text: "Leave the mine and check the barrels.", next: "barrels" }
        ]
      },

      barrels: {
        text: `
Kai walks toward the cluster of metal barrels.

Many are dented, some are cracked. Faded labels read:

<b>NEPTUNIUM WASTE — LONG-TERM STORAGE REQUIRED</b>

A handheld scanner shows radiation leaking slowly into the soil.
If these barrels fail completely, the contamination could spread through the valley for thousands of years.

This waste was never meant to stay here.

        `,
        choices: [
          { text: "Mark the area and plan containment later.", next: "reactor_hint" },
          { text: "Search for where the waste originally came from.", next: "reactor" }
        ]
      },

      river: {
        text: `
Kai kneels by the river.

The water looks clear, but the scanner shows elevated radiation.
Small fish swim slowly, some with pale patches on their scales.

Upstream, pipes disappear into the rock — someone was dumping or leaking material into the water.

If this continues, the contamination could reach towns downstream.

        `,
        choices: [
          { text: "Follow the pipes back into the valley.", next: "reactor" },
          { text: "Take samples and return to the mine.", next: "mine" }
        ]
      },

      reactor_hint: {
        text: `
Kai marks the barrels on the map.

The labels mention an “experimental reactor facility” nearby.
If the reactor is still active or leaking, it could be the source of the spike.

To save the valley, Kai needs to find that reactor.

        `,
        choices: [
          { text: "Search for the hidden reactor.", next: "reactor" }
        ]
      },

      reactor: {
        text: `
Deep underground, behind a half-collapsed tunnel, Kai finds a reinforced door.

Inside is a small <b>experimental reactor</b>, once used to test uranium and neptunium fuel.
Lights flicker. Instruments beep weakly. The reactor core is still warm.

Readouts show unstable levels. It’s leaking radioactive byproducts into the rock and water.

Kai has three options:

• Try to <b>shut down the reactor manually</b>.  
• Call for an <b>emergency containment team</b>.  
• Do nothing and leave.

What does Kai choose?
        `,
        choices: [
          { text: "Shut down the reactor manually.", next: "manual_shutdown" },
          { text: "Call for an emergency containment team.", next: "team_call" },
          { text: "Do nothing and leave.", next: "bad_meltdown" }
        ]
      },

      manual_shutdown: {
        text: `
Kai studies the old control panel.

The shutdown sequence is risky: one wrong move could destabilise the core.
But leaving it running will slowly poison the valley.

With careful steps, Kai reduces power, closes coolant loops, and seals the core.

The hum fades. The reactor finally goes quiet.

Radiation levels begin to drop — but the waste and contamination remain.

        `,
        choices: [
          { text: "Begin long-term cleanup of the valley.", next: "good_ending" },
          { text: "Seal the area and leave it closed forever.", next: "neutral_ending" }
        ]
      },

      team_call: {
        text: `
Kai sends an urgent message:

“Experimental reactor still active. Uranium and neptunium waste leaking. Request full containment team.”

Hours later, specialists arrive with shielding, robots, and deep-storage plans.
They stabilise the reactor and start securing the waste.

It’s safer now — but the delay allowed more contamination to spread.

Some parts of the valley may never fully recover.

        `,
        choices: [
          { text: "Help restore what can be saved.", next: "neutral_ending" }
        ]
      },

      bad_meltdown: {
        text: `
